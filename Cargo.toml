[workspace]
resolver = "3"
members = ["crates/core", "crates/probe", "crates/edge"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc"] }
quick-xml = { version = "0.37", features = ["async-tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "http2", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
