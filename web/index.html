<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0f12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>OpenIPTV</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="brand"><img src="/favicon.svg" alt="" width="24" height="24" />OpenIPTV</span>
      <nav>
        <a href="#/home" data-route="home">Home</a>
        <a href="#/live" data-route="live">Live TV</a>
      </nav>
      <span id="status" class="status" aria-live="polite"></span>
    </header>
    <main id="view"></main>
    <div id="player" class="player" hidden>
      <video id="video" autoplay playsinline></video>
      <div class="osd">
        <div class="osd-top">
          <button id="player-close" aria-label="Close player">✕</button>
          <span id="osd-channel"></span>
          <span id="osd-timing" class="timing"></span>
        </div>
        <div class="osd-bottom">
          <button id="player-prev" aria-label="Previous channel">▲</button>
          <div class="osd-shows">
            <div id="osd-now"></div>
            <div id="osd-next" class="muted"></div>
          </div>
          <button id="player-next" aria-label="Next channel">▼</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
