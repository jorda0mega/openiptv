name: OpenIPTV
options:
  bundleIdPrefix: com.jorda0mega
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your team in Xcode → Signing & Capabilities to run on your devices.
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    OTHER_LDFLAGS: ["-ObjC"]
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

# Shared by both apps. MPVKit's LGPL static libraries come from
# scripts/fetch-mpvkit.sh (run automatically before the first build).
targetTemplates:
  OpenIPTVApp:
    type: application
    preBuildScripts:
      - name: Fetch MPVKit
        script: '[ -d "$SRCROOT/Vendor/Libmpv.xcframework" ] || "$SRCROOT/scripts/fetch-mpvkit.sh"'
        basedOnDependencyAnalysis: false
    dependencies:
      - framework: Vendor/Libmpv.xcframework
        embed: false
      - framework: Vendor/Libavcodec.xcframework
        embed: false
      - framework: Vendor/Libavdevice.xcframework
        embed: false
      - framework: Vendor/Libavfilter.xcframework
        embed: false
      - framework: Vendor/Libavformat.xcframework
        embed: false
      - framework: Vendor/Libavutil.xcframework
        embed: false
      - framework: Vendor/Libswresample.xcframework
        embed: false
      - framework: Vendor/Libswscale.xcframework
        embed: false
      - framework: Vendor/Libssl.xcframework
        embed: false
      - framework: Vendor/Libcrypto.xcframework
        embed: false
      - framework: Vendor/Libass.xcframework
        embed: false
      - framework: Vendor/Libfreetype.xcframework
        embed: false
      - framework: Vendor/Libfribidi.xcframework
        embed: false
      - framework: Vendor/Libharfbuzz.xcframework
        embed: false
      - framework: Vendor/MoltenVK.xcframework
        embed: false
      - framework: Vendor/Libshaderc_combined.xcframework
        embed: false
      - framework: Vendor/lcms2.xcframework
        embed: false
      - framework: Vendor/Libplacebo.xcframework
        embed: false
      - framework: Vendor/Libdovi.xcframework
        embed: false
      - framework: Vendor/Libunibreak.xcframework
        embed: false
      - framework: Vendor/gmp.xcframework
        embed: false
      - framework: Vendor/nettle.xcframework
        embed: false
      - framework: Vendor/hogweed.xcframework
        embed: false
      - framework: Vendor/gnutls.xcframework
        embed: false
      - framework: Vendor/Libdav1d.xcframework
        embed: false
      - framework: Vendor/Libuavs3d.xcframework
        embed: false
      - framework: Vendor/Libuchardet.xcframework
        embed: false
      - framework: Vendor/Libbluray.xcframework
        embed: false
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: VideoToolbox.framework
      - sdk: IOSurface.framework
      - sdk: libbz2.tbd
      - sdk: libiconv.tbd
      - sdk: libexpat.tbd
      - sdk: libresolv.tbd
      - sdk: libxml2.tbd
      - sdk: libz.tbd
      - sdk: libc++.tbd

targets:
  OpenIPTV:
    templates: [OpenIPTVApp]
    scheme:
      testTargets: ["OpenIPTV UITests", "OpenIPTV UnitTests"]
    platform: iOS
    sources:
      - OpenIPTV
    info:
      path: OpenIPTV/Info.plist
      properties:
        CFBundleDisplayName: Openreel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Openreel connects to Emby servers and IPTV sources on your local network.
        NSLocationWhenInUseUsageDescription: Openreel uses your approximate location once to show your local channels. It stays on this device.
        # Dark everywhere, including UIKit-backed fields in sheets.
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jorda0mega.openiptv
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"

  OpenIPTV TV:
    templates: [OpenIPTVApp]
    platform: tvOS
    scheme:
      testTargets: ["OpenIPTV TV UITests"]
    sources:
      - path: OpenIPTV
        excludes:
          - "Resources/**"
          - "Info.plist"
      - OpenIPTV-tvOS
    info:
      path: OpenIPTV-tvOS/Info.plist
      properties:
        CFBundleDisplayName: Openreel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Openreel connects to Emby servers and IPTV sources on your local network.
        NSLocationWhenInUseUsageDescription: Openreel uses your approximate location once to show your local channels. It stays on this device.
        # Dark everywhere, including UIKit-backed fields in sheets.
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: OpenIPTV
        # Same bundle ID as iOS: one App Store Connect record, universal purchase.
        PRODUCT_BUNDLE_IDENTIFIER: com.jorda0mega.openiptv
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"

  # iPhone: the app driven by taps and turns, with screenshots
  # (xcodebuild test -scheme OpenIPTV on an iPhone simulator).
  OpenIPTV UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests-iOS]
    dependencies:
      - target: OpenIPTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jorda0mega.openiptv.uitests
        TEST_TARGET_NAME: OpenIPTV
        GENERATE_INFOPLIST_FILE: YES

  # Logic with no app around it (the remote's swipes, subtitle timing), in
  # seconds: xcodebuild test -scheme OpenIPTV -only-testing:"OpenIPTV UnitTests".
  OpenIPTV UnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - UnitTests
      - OpenIPTV/Player/RemoteSwipe.swift
      - OpenIPTV/Player/SubtitleSync.swift
      - OpenIPTV/Player/QualityGovernor.swift
      - OpenIPTV/Player/RelayRoutes.swift
      - OpenIPTV/Live/WatchOn.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jorda0mega.openiptv.unittests
        GENERATE_INFOPLIST_FILE: YES

  # The Siri Remote against the app on an Apple TV simulator (focus, the
  # player's remote): xcodebuild test -scheme "OpenIPTV TV UITests".
  OpenIPTV TV UITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [UITests-tvOS]
    dependencies:
      - target: OpenIPTV TV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jorda0mega.openiptv.tvuitests
        TEST_TARGET_NAME: OpenIPTV TV
        GENERATE_INFOPLIST_FILE: YES
